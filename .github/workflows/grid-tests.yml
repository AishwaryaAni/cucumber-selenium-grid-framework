name: Cross-Browser Grid Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 4 * * *"   # nightly, 09:30 IST
  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tag expression"
        required: false
        default: "@regression"

concurrency:
  group: grid-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.browser }} on Selenium Grid
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]

    # One Dockerised Selenium node per matrix leg, 4 parallel sessions
    services:
      selenium:
        image: selenium/standalone-${{ matrix.browser }}:latest
        ports:
          - 4444:4444
        options: --shm-size=2g
        env:
          SE_NODE_MAX_SESSIONS: "4"
          SE_NODE_OVERRIDE_MAX_SESSIONS: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for Selenium Grid to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4444/status | grep -q '"ready": *true'; then
              echo "Grid ready"; exit 0
            fi
            sleep 2
          done
          echo "Grid did not become ready"; curl -s http://localhost:4444/status; exit 1

      - name: Run BDD scenarios on ${{ matrix.browser }}
        id: tests
        continue-on-error: true
        run: >
          mvn -B clean test
          -Dexecution=remote
          -Dgrid.url=http://localhost:4444
          -Dbrowser=${{ matrix.browser }}
          "-Dcucumber.filter.tags=${{ github.event.inputs.tags || '@regression' }}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 14

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: target/cucumber-report.html
          retention-days: 14

      - name: Fail the job if scenarios failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Scenarios failed on ${{ matrix.browser }} — see the Allure report."
          exit 1

  report:
    name: Merge cross-browser Allure report
    needs: test
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download results from every browser
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Set up JDK (Allure CLI needs Java)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (for Allure CLI)
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Generate combined Allure report
        run: npx --yes allure-commandline generate allure-results --clean -o allure-report

      - name: Write run summary
        run: |
          node -e '
            const s = require("./allure-report/widgets/summary.json").statistic;
            const rate = s.total ? ((s.passed / s.total) * 100).toFixed(1) : "0";
            console.log(`### Cross-browser results\n\n| Total | Passed | Failed | Broken | Skipped | Pass rate |\n|---|---|---|---|---|---|\n| ${s.total} | ${s.passed} | ${s.failed} | ${s.broken} | ${s.skipped} | ${rate}% |`);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined report (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  publish-report:
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
