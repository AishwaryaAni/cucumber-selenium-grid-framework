# ---------- Application under test ----------
baseUrl=https://the-internet.herokuapp.com

# ---------- Execution ----------
# local  = browser on this machine (Selenium Manager resolves the driver)
# remote = Selenium Grid at grid.url (see docker-compose.yml)
execution=local
grid.url=http://localhost:4444

# chrome | firefox | edge
browser=chrome
headless=false

# ---------- Timeouts (seconds) ----------
explicit.wait=15
page.load.timeout=45
